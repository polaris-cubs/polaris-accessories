services:
    backend:
        build: ./polaris-backend
        container_name: polaris-backend
        restart: always
        environment:
            PORT: "8080"
            SQLITE_DB_PATH: "/app/data/polaris.db"
        ports:
            - "8080:8080"
        volumes:
            - ./polaris-backend:/app

    frontend:
        build: ./polaris-dashboard
        container_name: polaris-dashboard
        restart: always
        depends_on:
            - backend
        ports:
            - "3000:3000"
        volumes:
            - ./polaris-dashboard:/app
            - /app/node_modules
